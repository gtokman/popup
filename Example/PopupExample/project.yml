name: PopupExample
options:
  bundleIdPrefix: com.gtokman.popup
  deploymentTarget:
    iOS: "18.0"
packages:
  popup:
    path: ../..
  SnapKit:
    url: https://github.com/SnapKit/SnapKit
    from: 5.7.1
  Then:
    url: https://github.com/devxoul/Then
    from: 3.0.0
  UITextView-Placeholder:
    url: https://github.com/devxoul/UITextView-Placeholder.git
    from: 1.5.0
targets:
  PopupExample:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/PopupExample
        excludes:
          - Info.plist
    info:
      path: Sources/PopupExample/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    dependencies:
      - package: popup
        product: popup
      - package: SnapKit
        product: SnapKit
      - package: Then
        product: Then
      - package: UITextView-Placeholder
        product: UITextView-Placeholder
    settings:
      base:
        DEVELOPMENT_TEAM: NTP2A7PJM8
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.gtokman.popup.example
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
