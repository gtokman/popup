name: PopupExample
options:
  bundleIdPrefix: com.gtokman.popup
  deploymentTarget:
    iOS: "17.0"
packages:
  Popup:
    path: ../..
targets:
  PopupExample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PopupExample
        excludes:
          - Info.plist
    info:
      path: Sources/PopupExample/Info.plist
    dependencies:
      - package: Popup
        product: Popup
    settings:
      base:
        DEVELOPMENT_TEAM: NTP2A7PJM8
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.gtokman.popup.example
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
